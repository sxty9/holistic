# Workspace root = repo root. The project-neutral SDK holisdk lives in its OWN repo, OUTSIDE
# this one; it is linked in at `holisdk/` as a sibling symlink at setup time (see
# services/dashboard/install.sh + .gitignore /holisdk). The glob `holisdk/*` then resolves
# @holisdk/ui through that link, consumed in-workspace via `workspace:*`.
packages:
  - holisdk/*
  - frontend/app
allowBuilds:
  esbuild: true
